<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miners World</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Arial, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #itemTooltip {
    position: fixed; transform: translate(-50%, -130%);
    background: rgba(0,0,0,0.85); color: #fff; font-size: 12px;
    padding: 4px 8px; border-radius: 5px; pointer-events: none;
    white-space: nowrap; z-index: 30; display: none;
  }
  #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
  #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

  #hotbar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 10; user-select: none;
    max-width: 95vw; flex-wrap: nowrap;
  }
  .slot {
    width: 46px; height: 46px; background: rgba(20,20,20,0.55);
    border: 2px solid rgba(255,255,255,0.3); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; flex: 0 0 auto;
  }
  .slot.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
  .slot .swatch {
    width: 32px; height: 32px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.4);
    background-size: cover; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .slot .num {
    position: absolute; top: 2px; left: 4px; font-size: 10px; color: #fff;
    text-shadow: 0 0 3px #000;
  }
  .slot .count {
    position: absolute; bottom: 1px; right: 3px; font-size: 11px; font-weight: bold;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
  }

  #modeLabel {
    position: fixed; top: 40px; right: 14px; color: #fff; z-index: 10; font-size: 12px; opacity: 0.75;
  }

  #healthBar {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 14px; background: rgba(20,20,20,0.55);
    border: 2px solid rgba(255,255,255,0.3); border-radius: 7px;
    overflow: hidden; z-index: 10; display: none;
  }
  #healthFill {
    height: 100%; width: 100%; background: linear-gradient(90deg, #d32f2f, #f66);
    transition: width 0.15s;
  }

  #blockPicker {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); color: #fff;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 25; text-align: center;
  }
  #blockPicker h1 { margin: 0 0 14px; font-size: 26px; }
  #pickerGrid {
    display: grid; grid-template-columns: repeat(5, 64px); gap: 10px;
  }
  .picker-cell {
    width: 64px; height: 64px; background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .picker-cell:hover { background: rgba(255,255,255,0.24); border-color: #fff; }
  .picker-cell .swatch {
    width: 40px; height: 40px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.4);
    background-size: cover; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #blockPicker .hint { margin-top: 16px; font-size: 13px; opacity: 0.7; }

  #info {
    position: fixed; top: 14px; left: 14px; color: #fff; z-index: 10;
    background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.6; max-width: 260px;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    z-index: 20; text-align: center; cursor: pointer;
  }
  #overlay h1 { margin: 0 0 10px; font-size: 32px; }
  #overlay p { margin: 4px 0; font-size: 15px; opacity: 0.9; }
  #overlay .hint { margin-top: 20px; font-size: 13px; opacity: 0.7; }
  #fps { position: fixed; top: 14px; right: 14px; color: #fff; z-index: 10; font-size: 12px; opacity: 0.6; }

  #damageFlash {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(ellipse at center, rgba(200,0,0,0) 55%, rgba(180,0,0,0.55) 100%);
    opacity: 0;
  }
  #damageFlash.hit { animation: damageFlashAnim 0.45s ease-out; }
  @keyframes damageFlashAnim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .menu-btn {
    margin: 6px 0; padding: 10px 28px; min-width: 200px;
    font-size: 15px; font-family: inherit; color: #fff; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    border-radius: 8px; transition: background 0.12s, border-color 0.12s;
  }
  .menu-btn:hover { background: rgba(255,255,255,0.24); border-color: #fff; }
  #menuButtons, #controlsPanel { display: flex; flex-direction: column; align-items: center; }
  #controlsPanel { display: none; }
  #controlsPanel table { margin: 8px 0 16px; border-collapse: collapse; font-size: 14px; }
  #controlsPanel td { padding: 3px 14px; text-align: left; opacity: 0.92; }
  #controlsPanel td.key {
    font-weight: bold; color: #ffe08a; text-align: right;
    white-space: nowrap; font-family: 'Segoe UI', monospace;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="fps"></div>
<div id="damageFlash"></div>
<div id="modeLabel"></div>
<div id="healthBar"><div id="healthFill"></div></div>
<div id="hotbar"></div>
<div id="itemTooltip"></div>
<div id="blockPicker">
  <h1>Select Block</h1>
  <div id="pickerGrid"></div>
  <p class="hint">Click a block to assign it to the selected slot &middot; B or Esc to close</p>
</div>
<div id="overlay">
  <div id="menuButtons">
    <h1 id="menuTitle">Block World</h1>
    <p id="menuSubtitle">Click to play</p>
    <button class="menu-btn" id="btnResume">Play</button>
    <button class="menu-btn" id="btnControls">Controls</button>
    <button class="menu-btn" id="btnRegen">Regenerate World</button>
    <button class="menu-btn" id="btnCreative">Mode: Creative</button>
  </div>
  <div id="controlsPanel">
    <h1>Controls</h1>
    <table>
      <tr><td class="key">WASD</td><td>Move</td></tr>
      <tr><td class="key">Mouse</td><td>Look around</td></tr>
      <tr><td class="key">Space</td><td>Jump</td></tr>
      <tr><td class="key">Left click</td><td>Destroy block</td></tr>
      <tr><td class="key">Right click</td><td>Place block</td></tr>
      <tr><td class="key">1 – 5</td><td>Select block type</td></tr>
      <tr><td class="key">B</td><td>Open block picker</td></tr>
      <tr><td class="key">C</td><td>Toggle Creative / Survival</td></tr>
      <tr><td class="key">Esc</td><td>Pause / menu</td></tr>
    </table>
    <button class="menu-btn" id="btnBack">Back</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
